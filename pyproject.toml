[project]
name = "simulador-de-so"
version = "0.1.0"
description = "simulador de sistema operativo para la clase de arquitectura de sistemas operativos"
readme = "README.md"
authors = [
    { name = "Luis Perez", email = "lfpt915@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    # Dispositivos USB (solo Windows): WMI consulta dispositivos/drivers y pywin32 aporta COM
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
simulador-de-so = "simulador_de_so:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
